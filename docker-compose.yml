services:
  postgres:
    image: postgres:16
    container_name: cricapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cricapp
      POSTGRES_PASSWORD: cricapp_dev_password
      POSTGRES_DB: cricapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/ingestion/data/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7
    container_name: cricapp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: