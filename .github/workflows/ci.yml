name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace @cricapp/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cricapp

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
